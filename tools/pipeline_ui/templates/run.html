<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Running Pipeline — Fiber Pipeline</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <div class="page-wrap">

    <header class="site-header">
      <div class="header-inner">
        <span class="logo">🔦</span>
        <div>
          <h1>Running Pipeline</h1>
          <p class="subtitle" id="statusLabel">Initializing…</p>
        </div>
      </div>
    </header>

    <!-- Step progress bar -->
    <div class="progress-section">
      <div class="step-bar" id="stepBar">
        {% for i in range(1, 11) %}
        <div class="step-pip" id="pip-{{ i }}" title="Step {{ i }}">{{ i }}</div>
        {% endfor %}
      </div>
    </div>

    <!-- Processing spinner (visible during normal operation) -->
    <div class="processing-area" id="processingArea">
      <div class="spin-ring"></div>
      <p class="processing-label" id="processingLabel">Processing…</p>
    </div>

    <!-- Error log (hidden; revealed only when the pipeline fails) -->
    <div class="log-card" id="logCard" style="display:none">
      <div class="log-header">
        <span>Output</span>
        <span class="log-badge failed" id="logBadge">Error</span>
      </div>
      <div class="log-body" id="logBody"></div>
    </div>

  </div>

  <script src="{{ url_for('static', filename='run.js') }}"></script>
  <script>
    startStream("{{ job_id }}");
  </script>
</body>
</html>
